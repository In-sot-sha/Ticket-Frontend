<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f43f5e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- ── PWA / Install ──────────────────────────────── -->
    <!-- manifest.json is injected by vite-plugin-pwa at build time -->

    <!-- Android Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PartyStorm" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <!-- ── Icons ─────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="canonical" href="https://partystorm.vercel.app" />

    <!-- Ticket design fonts (classic / boarding / concert) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Great+Vibes&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ── SEO / Social ──────────────────────────────── -->
    <title>PartyStorm — Discover &amp; Book Event Tickets in Nigeria</title>
    <meta name="description" content="Discover, book and manage event tickets in Nigeria. From concerts to conferences, find the best events near you on PartyStorm. Your go-to platform for live entertainment." />
    <meta name="keywords" content="events, tickets, concerts, conferences, live entertainment, Nigeria, event booking, ticketing platform" />
    <meta name="author" content="PartyStorm" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="https://partystorm.vercel.app" />
    <meta property="og:title" content="PartyStorm — Discover &amp; Book Event Tickets in Nigeria" />
    <meta property="og:description" content="Find and book tickets for the best live events near you. Concerts, conferences, festivals, and more." />
    <meta property="og:image" content="https://partystorm.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="PartyStorm - Discover and Book Event Tickets in Nigeria" />
    <meta property="og:site_name" content="PartyStorm" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@partystorm" />
    <meta name="twitter:url" content="https://partystorm.vercel.app" />
    <meta name="twitter:title" content="PartyStorm — Event Tickets" />
    <meta name="twitter:description" content="Discover and book tickets for live events in Nigeria." />
    <meta name="twitter:image" content="https://partystorm.vercel.app/og-image.png" />

    <!-- ── Structured Data (JSON-LD) ──────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PartyStorm",
        "url": "https://partystorm.vercel.app",
        "description": "Discover and book event tickets in Nigeria."
      }
    </script>

    <!-- Instant theme before JS (matches ThemeProvider storageKey) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vite-ui-theme');
          var dark =
            t === 'dark' ||
            (t !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #fafafa;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }
      html.dark #app-boot { background: #0a0a0a; }
      #app-boot.app-boot--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-boot .ab-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #f43f5e;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.03em;

      }
      #app-boot .ab-footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 28px 24px calc(28px + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      #app-boot .ab-title {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #a3a3a3;
      }
      #app-boot .ab-tip {
        margin: 8px auto 0;
        max-width: 320px;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.45;
        color: #525252;
      }
      html.dark #app-boot .ab-tip { color: #d4d4d4; }
      @keyframes ab-breathe {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        50% { transform: translate(-50%, -50%) scale(0.94); opacity: 0.85; }
      }
    </style>
  </head>
  <body>

</html>
